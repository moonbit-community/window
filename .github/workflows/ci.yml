name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          moon version --all
          moon update

      - name: Run repository gate
        run: scripts/check_ci.sh
